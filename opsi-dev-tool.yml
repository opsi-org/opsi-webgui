package:
  architecture: all
  depends:
    - opsiconfd (>= 4.3.52.5)
  name: opsi-webgui
  postinst_script:
    - echo "OPSI webgui folder '/usr/lib/opsiconfd/addons/webgui'"
    - '[ -e /var/lib/opsiconfd/addons/webgui ] && rm -r /var/lib/opsiconfd/addons/webgui'
    - exit 0
  source_script: |
    mkdir -p "${DST}/rootfs/usr/lib/opsiconfd/addons"
    cp -a "${SRC}/webgui" "${DST}/rootfs/usr/lib/opsiconfd/addons/webgui"
  type: binary
transifex:
  # English is the source resource; German and French are pulled back as
  # translations by the `setup:i18n` CI job.
  download_translations:
    - install_dir: frontend/i18n/locales
      languages:
        - de
        - fr
      organization: opsi-org
      project: opsiorg
      resource_name: opsi-webgui.json
  upload_resource:
    - organization: opsi-org
      project: opsiorg
      resource_file: frontend/i18n/locales/opsi-webgui_en.json
      resource_name: opsi-webgui.json
project:
  allow_tag_delete: false
  description: opsiconfd addon opsi-webgui
  homepage: http://www.opsi.org
  licenses:
    - license: AGPL-3.0
  maintainer: uib GmbH <info@uib.de>
  name: opsi-webgui
  version: "4.3.48.7"
  version_files:
    frontend/package.json: '$.version'
    backend/webgui/python/const.py: 'ADDON_VERSION'
