    MYSQL_USER: 'opsi'
    MYSQL_PASSWORD: 'opsi'
  script:
    - *install_dev_cli
    - *prepare_backend_tests
    - echo "##########################################"
    - echo "##################pytest##################"
    - echo "##########################################"
    - *pytest
  allow_failure: true ##### TODO remove again

