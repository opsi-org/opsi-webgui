image: node:23.0.0-bookworm-slim

stages:
  - check
  - init
  - test
  - build
  - upload
  - publish
  - release

.define_globals: &define_globals |
  shopt -s expand_aliases

.install_playwright: &install_playwright |
  npm i -D @playwright/test
  npx playwright install --with-deps chromium

.start_storybook: &start_storybook |
  PORT=3003 nohup npm run story > .storybook.log &

.start_webgui: &start_webgui |
  PORT=8888 nohup npm run dev > .dev.log &

.install_tools: &install_tools |
  export DEBIAN_FRONTEND=noninteractive
  apt update
  apt -y install debhelper osc zip
  # wget http://binaryindex.uib.gmbh/development/opsi-dev-tools/linux/x64/opsi-dev-tools_linux_x64_1.0.79.tar.gz
  # tar -xf opsi-dev-tools_linux_x64_1.0.79.tar.gz
  curl -o opsi-dev-tools.tar.gz "$OPSIDEVTOOLS_URL_LINUX_X64"
  tar -xvf opsi-dev-tools.tar.gz
  cp opsi-dev-tool opsi-dev-cli

.prepare_backend_tests: &prepare_backend_tests |
  apt update
  echo "install stuff"
  apt -y install git
  apt -y install bc wget python3-pip python3-dev python3-venv iproute2 net-tools iputils-ping
  git clone -b devel https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.uib.gmbh/uib/opsiconfd.git

  cd opsiconfd

   # Install debian packages
  export DEBIAN_FRONTEND=noninteractive
  apt update
  apt -y install debhelper osc
  apt -y install python3-dev
  apt -y install mariadb-client bc
  pip3 install --trusted-host pypi.uib.gmbh --index-url http://pypi.uib.gmbh:8080/simple opsi-dev-tools
  pip3 install poetry


  # Grant full database access to opsi user
  mysql --host=mysql --user=root --password=${MYSQL_ROOT_PASSWORD} -e "GRANT ALL ON opsitest.* TO 'opsi'@'%';"

  # Get config files from opsi-server package
  [ -e /etc/opsi ] && rm -r /etc/opsi
  [ -e ../opsi-server ] && rm -r ../opsi-server
  url=$(git remote -v | grep fetch | cut -f2 | sed s'#/opsiconfd.git.*#/opsi-server.git#')
  #branch=$(git rev-parse --abbrev-ref HEAD)
  branch=master
  GIT_TERMINAL_PROMPT=0 git clone --branch $branch $url ../opsi-server
  cp -a ../opsi-server/opsi-server_data/etc /etc/opsi

  # Configure opsiconfd
  mkdir -p /var/lib/opsi/repository /var/lib/opsi/depot

  echo "redis-internal-url = redis://redis" >> tests/data/default-opsiconfd.conf
  echo "log-level-stderr = 0" >> tests/data/default-opsiconfd.conf
  echo "log-level-file = 6" >> tests/data/default-opsiconfd.conf
  echo "log-file = /tmp/opsiconfd.log" >> tests/data/default-opsiconfd.conf
  echo "addon-dirs = [../backend/addon]" >> tests/data/default-opsiconfd.conf

  # Installing opsi test modules file
  mkdir -p /etc/opsi/licenses
  wget --header="Authorization: Bearer ${OPSILICSRV_TOKEN}" "https://opsi-license-server.uib.gmbh/api/v1/licenses/test?usage=opsiconfd-gitlab-ci" -O /etc/opsi/licenses/test.opsilic


  # linking python3 as python for compatibility
  # ln -s /usr/bin/python3 /usr/bin/python

  # Create dirs
  mkdir -p /var/log/opsi/clientconnect
  mkdir -p /var/lib/opsi/public
  mkdir -p /tftpboot

  # Install poetry
  pip3 install poetry
  poetry config experimental.new-installer false
  poetry lock --no-update
  poetry install
  poetry run opsiconfd -c tests/data/default-opsiconfd.conf -l5 setup

  # Create adminuser used in tests
  useradd adminuser
  echo "adminuser:adminuser" | chpasswd
  adduser adminuser opsiadmin

  # Start and wait for redis server
  # redis-server /etc/redis/redis.conf &
  sleep 20

.pytest: &pytest |

  [ -e /tmp/opsiconfd.log ] && rm /tmp/opsiconfd.log
  export OPSICONFD_MAX_SESSIONS_PER_IP=20000
  poetry run opsiconfd -c tests/data/default-opsiconfd.conf &
  sleep 60
  curl -I https://adminuser:adminuser@localhost:4447/admin
  echo "---------------------------------------"
  echo "Run tests"
  echo "---------------------------------------"
  exit_code=0
  pwd
  ls -la
  ls -la ../backend
  ls -la ../backend/addon
  # cp -R ../backend/tests
  poetry run pytest  --tb=short -v ../backend/tests || exit_code=$?
  if [ $exit_code -ne 0 ]; then
    echo "---------------------------------------"
    echo "opsiconfd log"
    echo "---------------------------------------"
    cat /tmp/opsiconfd.log
    exit $exit_code
  fi

.get_changed_files: &get_changed_files |
  cd uib-components
  changedFiles=$(git diff origin/v4.3 -r --no-commit-id --name-only | grep -i -P 'stories.js|test.component.js|test.unit.js|.vue' | grep -v 'test.component.js-snapshot')
  echo "$changedFiles"
  basenames=$(basename -s .stories.js $(basename -s .test.component.js $(basename -s .vue -a $changedFiles)))
  echo "$basenames"
  testfilesUnique=$(echo $basenames | tr ' ' '\n' | awk '!a[$0]++')
  # todo checking if each file in testfilesUnique exists
  echo "$testfilesUnique"
  cd ..

.npm_sbom: &npm_sbom |
  npm install --global @cyclonedx/cyclonedx-npm
  mkdir sbom
  npm sbom --sbom-format cyclonedx --omit dev > sbom/webgui-npm-cyclonedx.json
  npm sbom --sbom-format spdx --omit dev > sbom/webgui-npm-spdx.json

#########################################################################
######################################################################### init
#########################################################################
check:versions:
  stage: check
  image: docker.uib.gmbh/opsi/dev/pybuilder:deb9-py3.11 # cause smaller then node...
  script:
    # download yq (yml parser) https://github.com/mikefarah/yq?tab=readme-ov-file
    - wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq && chmod +x /usr/bin/yq
    - VERSION_YML=$(yq '.project.version' opsi-dev-tool.yml | sed -e "s/,//g" | sed "s/\"//g" | sed "s/'//g")
    # - VERSION_YML=$(grep opsi-dev-tool.yml -A 40 -e project | grep -m 1 -E "version:|version\":" | awk '{print $2}' | sed -e "s/,//g" | sed "s/\"//g" | sed "s/'//g")
    - echo $VERSION_YML
    - echo "----------------------------------------------------------------"
    - VERSION_YML2=$(yq '.pull-binaries[0].version' opsi-dev-tool.yml | sed -e "s/,//g" | sed "s/\"//g" | sed "s/'//g")
    # - VERSION_YML2=$(grep opsi-dev-tool.yml -A 30 -e pull-binaries | grep -m 1 -E "version:|version\":" | awk '{print $2}' | sed -e "s/,//g" | sed "s/\"//g" | sed "s/'//g")
    - VERSION_YML2=${VERSION_YML2//,/}
    - echo $VERSION_YML2
    - echo "----------------------------------------------------------------"
    # - VERSION_JSN=$(cat frontend/package.json | grep "\"version\"" | awk '{print $2}' | sed -e "s/,//g")
    - VERSION_JSN=$(yq '.version' opsiweb/package.json | sed -e "s/,//g" | sed "s/\"//g" | sed "s/'//g")
    # - VERSION_JSN=$(cat opsiweb/package.json | grep "\"version\"" | awk '{print $2}' | sed -e "s/,//g" | sed "s/\"//g" | sed "s/'//g")
    - VERSION_JSN=${VERSION_JSN//,/}
    - echo $VERSION_JSN
    - echo "----------------------------------------------------------------"
    - VERSION_PY=$(cat backend/addon/webgui/python/const.py | grep "ADDON_VERSION =" | awk '{print $3}' | sed -e "s/,//g" | sed "s/\"//g" | sed "s/'//g")
    - echo $VERSION_PY
    - TAG=$VERSION_YML
    - echo $TAG
    - echo "----------------------------------------------------------------"
    - if [ "$VERSION_YML" != "$VERSION_YML2" ]; then echo "Versions in opsi-dev-tool-yml doesnt match (project and pull-binaries section.. $VERSION_YML - $VERSION_YML2)"; exit 1; fi
    - if [ "$VERSION_YML" != "$VERSION_JSN" ]; then echo "Versions do not match for opsi-dev-tool-yml and frontend/package.json ($VERSION_YML - $VERSION_JSN) "; exit 1; else echo "Versions are equal $VERSION_YML"; fi
    - if [ "$VERSION_YML" != "$VERSION_PY" ]; then echo "Versions do not match for opsi-dev-tool-yml and backend/addon/webgui/python/const.py ($VERSION_YML - $VERSION_PY)"; exit 1; else echo "Versions are equal"; fi

init:npm:production:
  stage: init
  only:
    - v4.3
    - tags
    - sbom
  script:
    - cd opsiweb
    - *define_globals
    - npm --production --only=prod i #--legacy-peer-deps # Todo: whats the difference between --production and --only=prod
    - du -h --max-depth=0 node_modules # just for checking node_modules size (locally computed 251M; CICD: 360M)
    - *npm_sbom
  artifacts:
    paths:
      - opsiweb/package.json
      - opsiweb/node_modules/
      - opsiweb/sbom
    expire_in: 1 day
init:npm:
  stage: init
  script:
    - cd opsiweb
    - *define_globals
    - npm i #--legacy-peer-deps
    - du -h --max-depth=0 node_modules # just for checking node_modules size (locally computed: 674M; CICD: 801M)
    - *npm_sbom
  artifacts:
    paths:
      - opsiweb/package.json
      - opsiweb/node_modules/
      - opsiweb/sbom
    expire_in: 1 day
init:transifex:
  # this step have to be done before building webgui
  stage: init
  image: docker.uib.gmbh/opsi/dev/pybuilder:deb9-py3.11
  script:
    - TRANSIFEX_MIN_TRANSLATION_RATE=0.0
    - '[ "$CI_COMMIT_TAG" = "" ] || TRANSIFEX_MIN_TRANSLATION_RATE=1.0'
    - opsi-dev-cli -l debug transifex upload-resource opsiweb/uib-components/locale/opsi-webgui_en.json --resource-name opsi-webgui-old.json
    - opsi-dev-cli -l debug transifex download-translations opsi-webgui-old.json opsiweb/uib-components/locale/ --min-review-rate $TRANSIFEX_MIN_TRANSLATION_RATE -l de -l fr
    - chmod 666 opsiweb/uib-components/locale/*
    - echo "> rename files"
    - cd opsiweb/uib-components/locale/
    - find . -depth -name "opsi-webgui-old*" -exec bash -c 'mv -- "$0" "${0//-old/}"' {} \;
    - ls -lah
    - cat opsi-webgui_de.json # has to exist
    - cd -
  only:
    - tags
    - v4.3
  artifacts:
    name: "opsi-webgui-locale"
    paths:
      - opsiweb/uib-components/locale
    expire_in: 3 day
init:changelogs:
  # this step have to be done before building webgui
  stage: init
  image: docker.uib.gmbh/opsi/dev/pybuilder:deb9-py3.11
  script:
    - opsi-dev-cli -l 5 changelog from-git output
    # - cp -f output/changelog.md webgui/data/.
    - chmod 666 output/*
  only:
    - tags
    - v4.3
  artifacts:
    name: "opsi-webgui-changelogs"
    paths:
      - output
    expire_in: 1 day


