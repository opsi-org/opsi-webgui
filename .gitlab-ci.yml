# =============================================================================
# opsi-webgui GitLab CI/CD Pipeline
# STAGES:
#   setup    -> Install deps
#   validate -> Lint, types, tests, security scan
#   build    -> Compile frontend
#   release  -> Package, SBOM, publish (tags only)
# =============================================================================

image: node:22-bookworm-slim

variables:
  CI: 'true'
  DEBIAN_FRONTEND: noninteractive

stages: [setup, validate, build, release]

# TEMPLATES
.pybuilder:
  image: docker.uib.gmbh/opsi/dev/pybuilder:deb9-py3.11

.only-tags:
  rules:
    - if: $CI_COMMIT_TAG

.node:
  before_script:
    - corepack enable pnpm

.install-devtools: &install-devtools |
  apt update && apt -y install curl zip wget
  curl -sS "${OPSIDEVTOOLS_INSTALLER_URL_LINUX_X64}" | sh

# SETUP
setup:deps:
  stage: setup
  extends: .node
  script:
    - cd frontend && pnpm install --frozen-lockfile && pnpm run postinstall
  artifacts:
    paths: [frontend/node_modules/, frontend/.nuxt/]
    expire_in: 1 day

# setup:i18n:
#   stage: setup
#   extends: .pybuilder
#   script:
#     - RATE=0.0 && [ "$CI_COMMIT_TAG" != "" ] && RATE=1.0
#     - opsi-dev-cli -l 6 transifex download-translations opsi-webgui.json frontend/i18n/locales/ --min-translation-rate $RATE || true
#     - chmod -R 666 frontend/i18n/locales/* || true
#   artifacts:
#     paths: [frontend/i18n/locales/]
#     expire_in: 3 days
#   rules:
#     - if: $CI_COMMIT_TAG
#     - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
#     - when: manual
#       allow_failure: true

setup:changelog:
  stage: setup
  extends: .pybuilder
  script:
    - opsi-dev-cli -l 5 changelog from-git output
    - chmod 666 output/*
  artifacts:
    paths: [output/]
    expire_in: 1 day

setup:versions:
  stage: setup
  extends: .pybuilder
  script:
    - wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq && chmod +x /usr/bin/yq
    - |
      V_YML=$(yq '.project.version' opsi-dev-tool.yml | tr -d '"')
      V_PKG=$(yq '.version' frontend/package.json | tr -d '"')
      V_PY=$(grep "ADDON_VERSION =" backend/webgui/python/const.py | awk '{print $3}' | tr -d '"')
      echo "Versions: yml=$V_YML pkg=$V_PKG py=$V_PY"
      [ "$V_YML" = "$V_PKG" ] && [ "$V_YML" = "$V_PY" ] || { echo "ERROR: Version mismatch"; exit 1; }

# VALIDATE
validate:lint:
  stage: validate
  extends: .node
  needs: [setup:deps]
  script: cd frontend && pnpm run lint

validate:types:
  stage: validate
  extends: .node
  needs: [setup:deps]
  script: cd frontend && pnpm run typecheck

# validate:test:
#   stage: validate
#   needs: [setup:deps]
#   script: cd frontend && pnpm run test:unit
#   coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'

validate:security:
  stage: validate
  extends: .node
  needs: [setup:deps]
  script:
    - cd frontend
    - echo "=== Checking for vulnerabilities ==="
    - pnpm audit --audit-level=high
  allow_failure: true

# TODO: Backend tests
# validate:backend:
#   stage: validate
#   extends: .pybuilder
#   script: cd backend && pytest tests/

# BUILD
build:addon:
  stage: build
  extends: .node
  needs:
    [
      setup:deps,
      validate:lint,
      validate:types,
      { job: setup:i18n, optional: true },
      { job: setup:changelog, optional: true },
    ]
  script:
    - apt update && apt -y install zip
    - bash "$(pwd)/scripts/build_addon.sh" webgui "opsi-WebGUI" "$(pwd)"
    - ls -lah opsi-webgui.zip webgui/
  artifacts:
    name: 'opsi-webgui-${CI_COMMIT_REF_NAME}'
    paths: [opsi-webgui.zip, webgui/]
    expire_in: 7 days

build:addon-nuxt4:
  stage: build
  extends: .node
  needs: [setup:deps, { job: setup:i18n, optional: true }, { job: setup:changelog, optional: true }]
  script:
    - apt update && apt -y install zip
    - bash "$(pwd)/scripts/build_addon.sh" webgui-nuxt4 "opsi-WebGUI-Nuxt4" "$(pwd)"
    - ls -lah opsi-webgui-nuxt4.zip webgui-nuxt4/
  artifacts:
    name: 'opsi-webgui-nuxt4-${CI_COMMIT_REF_NAME}'
    paths: [opsi-webgui-nuxt4.zip, webgui-nuxt4/]
    expire_in: 7 days

# RELEASE (tags only)
release:sbom:
  stage: release
  extends: [.node, .only-tags]
  needs: [setup:deps]
  script: cd frontend && pnpm run sbom && mv ../sbom.json .
  artifacts:
    paths: [frontend/sbom.json]
    expire_in: 30 days
    reports:
      cyclonedx: frontend/sbom.json

release:binary-index:
  stage: release
  extends: [.pybuilder, .only-tags]
  needs: [build:addon, setup:versions, { job: setup:changelog, optional: true }]
  script:
    - opsi-dev-cli -l 6 binary push opsi-webgui.zip --product=opsi-webgui.zip
    - '[ -f output/changelog.md ] && opsi-dev-cli -l 6 release-service register-package-version opsi-webgui.zip TOOL --changelog-file output/changelog.md --files=opsi-webgui.zip || true'

release:obs-internal:
  stage: release
  extends: [.pybuilder, .only-tags]
  needs: [build:addon, setup:versions]
  script: opsi-dev-tool -l debug --obs-update-package https://obs.uib.gmbh home:uibmz:opsi:4.4:development

release:obs-external:
  stage: release
  extends: [.pybuilder, .only-tags]
  needs: [build:addon, setup:versions, { job: setup:changelog, optional: true }]
  script:
    - opsi-dev-tool -l debug --obs-update-package https://build.opensuse.org home:uibmz:opsi:4.4:development
    - |
      [ -f output/changelog.md ] && {
        opsi-dev-cli -l 6 release-service register-package-version opsi-webgui SERVER_PACKAGE --changelog-file output/changelog.md
        opsi-dev-cli -l 6 release-service push-repository-state opsi-webgui SERVER_PACKAGE SERVER_PACKAGE-4.4-development
      } || true
