image: node:23.0.0-bookworm-slim
# MARK: ENV
variables:
  CI: true
  FF_NETWORK_PER_BUILD: 1
  FF_SCRIPT_SECTIONS: 1
  DEBIAN_FRONTEND: noninteractive
  ADDON_DEV_PORT: "7777"
  MAIN: main

stages:
  - preinit
  - init
  - test
  - build

# MARK: SCRIPTS
.define_globals: &define_globals |
  shopt -s expand_aliases

.install_dev_cli: &install_dev_cli |
  apt update
  apt -y install debhelper osc zip
  curl -sS "${OPSIDEVTOOLS_INSTALLER_URL_LINUX_X64}" | sh
  opsi-dev-cli --version
  opsi-dev-tool --version

# MARK: PREINIT
preinit:versions:
  stage: preinit
  image: docker.uib.gmbh/opsi/dev/pybuilder:deb9-py3.11 # cause smaller then node...
  script:
    # download yq (yml parser) https://github.com/mikefarah/yq?tab=readme-ov-file
    - wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq && chmod +x /usr/bin/yq
    - echo "----------------------------------------------------------------"
    - VERSION_YML=$(yq '.project.version' opsi-dev-tool.yml | sed -e "s/,//g" | sed "s/\"//g" | sed "s/'//g")
    - echo $VERSION_YML

    #- echo "----------------------------------------------------------------"
    #- VERSION_YML2=$(yq '.pull-binaries[0].version' opsi-dev-tool.yml | sed -e "s/,//g" | sed "s/\"//g" | sed "s/'//g")
    #- echo $VERSION_YML2

    - echo "----------------------------------------------------------------"
    - VERSION_JSN=$(yq '.version' frontend/package.json | sed -e "s/,//g" | sed "s/\"//g" | sed "s/'//g")
    - echo $VERSION_JSN

    - echo "----------------------------------------------------------------"
    - VERSION_PY=$(cat backend/src/python/const.py | grep "ADDON_VERSION =" | awk '{print $3}' | sed -e "s/,//g" | sed "s/\"//g" | sed "s/'//g")
    - echo $VERSION_PY

    - echo "----------------------------------------------------------------"
    #- if [ "$VERSION_YML" != "$VERSION_YML2" ]; then echo "Versions in opsi-dev-tool-yml are uneuqal (project.version and pull-binaries[0].version].. $VERSION_YML - $VERSION_YML2)"; exit 1; fi
    - if [ "$VERSION_YML" != "$VERSION_JSN" ]; then echo "Versions do not match for opsi-dev-tool-yml and frontend/package.json ($VERSION_YML - $VERSION_JSN) "; exit 1; else echo "Versions are equal"; fi
    - if [ "$VERSION_YML" != "$VERSION_PY" ]; then echo "Versions do not match for opsi-dev-tool-yml and backend/src/python/const.py ($VERSION_YML - $VERSION_PY)"; exit 1; else echo "Versions are equal"; fi

# MARK: INIT
init:npm:
  stage: init
  script:
    - cd frontend
    - *define_globals
    - npm i
    - npm run dev &
    - sleep 10
  artifacts:
    paths:
      - frontend/package.json
      - frontend/node_modules/
      - frontend/.nuxt/
    expire_in: 1 day

# MARK: TEST
test:typescript:
  stage: test
  dependencies:
    - init:npm
  before_script:
    - cd frontend
    - *define_globals
  script:
    - npm run ts

test:build: # with transifex
  stage: test
  dependencies:
    - init:npm
    - test:typescript
  script:
    - cd frontend
    - npm i @nuxt/typescript-build
    - *define_globals
    - npm run generate
  artifacts:
    paths:
      - frontend/dist # not used...?
    expire_in: 3 day

build:zip: # with transifex
  stage: build
  dependencies:
    - init:npm
    - test:build
  script:
    - *install_dev_cli
    - pwd && ls -la frontend
    - bash "$(pwd)/scripts/build-app.sh" opsi-webgui "OPSI Webgui" $(pwd)/ no-install
    - ls -lah # debug
    - ls -lah frontend # debug
  artifacts:
    name: "opsi-webgui"
    paths:
      - opsi-webgui
    expire_in: 7 day
