build:screenshot:
  stage: build
  image: mcr.microsoft.com/playwright:v1.56.0-noble
  dependencies:
    - init:npm
    - init:transifex-down
  services:
    - name: mysql:latest
      command:
        - --max_connections=1000
      #- --default-authentication-plugin=mysql_native_password
      alias: mysql
    - name: redislabs/redistimeseries:latest
      alias: redis
  variables:
    MYSQL_ROOT_PASSWORD: 'opsi'
    MYSQL_DATABASE: 'opsitest'
    MYSQL_USER: 'opsi'
    MYSQL_PASSWORD: 'opsi'
    MYSQL_HOST: 'mysql'
    CI: true
    FF_NETWORK_PER_BUILD: true
    HOSTNAME: 'localhost'
  script:
    - *install_uv
    - *prepare_backend_minimal
    - cd frontend
    - bash scripts/build_production_local.sh webgui Webgui "$(pwd)/.." copydata
    - sleep 30
    - cd ..
    - echo ""
    - echo "MYSQL $OPSICONFD_MYSQL_INTERNAL_URL"
    - echo ""
    - *start_backend_minimal
    - sleep 40
    - cd frontend
    - mkdir test-results
    - npm ci
    - npx playwright install-deps
    #- npm run dev & # we use the production build here
    - npx playwright test tests/screenshot/
  artifacts:
    paths:
      - frontend/screenshots/opsidoc
      - frontend/test-results/
    expire_in: 2 days
    when: always
  only:
    - tags
    - v5
    - test/opsidocs

build:static:app: # with transifex
  stage: build
  dependencies:
    - init:npm
    - init:transifex-down
    # - test:lint # todo activate again for main
  script:
    - cd frontend
    - npm i @nuxt/typescript-build
    - *define_globals
    - npm run generate
  artifacts:
    paths:
      - frontend/dist # not used...?
    expire_in: 3 day
  only:
    - tags
    - v5

build:zip: # with transifex
  stage: build
  dependencies:
    - init:npm
    - init:transifex-down
    - init:changelogs
    - build:static:app
  script:
    - *install_dev_cli
    - pwd && ls -la frontend
    - bash "$(pwd)/frontend/scripts/build_production_local.sh" webgui Webgui $(pwd) no-install
    - ls -lah webgui # debug
  only:
    - tags
    - v5
    - ci/zip-dev
  artifacts:
    name: 'opsi-webgui'
    paths:
      - frontend/locale
      - webgui
    expire_in: 7 day

build:zip:dev: # with transifex
  stage: build
  dependencies:
    - init:npm
    - init:transifex-down
    - init:changelogs
  script:
    - *install_dev_cli
    - *define_globals
    - pwd && ls -la frontend
    - ls -lah frontend/locale
    - echo "builing opsi-webgui-dev.zip"
    - bash "$(pwd)/frontend/scripts/build_production_local.sh" webgui-dev Webgui-Dev $(pwd) no-install
    - ls -lah webgui-dev # debug
  artifacts:
    name: 'opsi-webgui-dev'
    paths:
      - frontend/locale
      - webgui-dev
    expire_in: 7 day

