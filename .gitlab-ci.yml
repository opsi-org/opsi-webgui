preinit:versions:
  stage: preinit
  image: docker.uib.gmbh/opsi/dev/pybuilder:deb9-py3.11 # cause smaller then node...
  script:
    - VERSION_YML=$(grep opsi-dev-tool.yml -A 20 -e project | grep -m 1 "version:" | awk '{print $2}' | sed -e "s/,//g" | sed "s/\"//g" | sed "s/'//g")
    - echo $VERSION_YML
    - echo "----------------------------------------------------------------"
    # ---------------
    - VERSION_YML2=$(grep opsi-dev-tool.yml -A 100 -e pull-binaries | grep -m 1 "version:" | awk '{print $2}' | sed -e "s/,//g" | sed "s/\"//g" | sed "s/'//g")
    # - VERSION_YML2=$(grep opsi-dev-tool.yml -A 100 -e pull-binaries | grep -m 1 "\"version:\"" | awk '{print $2}')
    - VERSION_YML2=${VERSION_YML2//,/}
    - echo $VERSION_YML2
    - echo "----------------------------------------------------------------"
    # ---------------
    # - VERSION_JSN=$(cat frontend/package.json | grep "\"version\"" | awk '{print $2}' | sed -e "s/,//g")
    - VERSION_JSN=$(cat frontend/package.json | grep "\"version\"" | awk '{print $2}' | sed -e "s/,//g" | sed "s/\"//g" | sed "s/'//g")
    - VERSION_JSN=${VERSION_JSN//,/}
    - echo $VERSION_JSN
    - echo "----------------------------------------------------------------"
    # ---------------
    - VERSION_PY=$(cat backend/addon/webgui/python/const.py | grep "ADDON_VERSION =" | awk '{print $3}' | sed -e "s/,//g" | sed "s/\"//g" | sed "s/'//g")
    - echo $VERSION_PY
    # ---------------
    - TAG=$VERSION_YML
    - echo $TAG
    - echo "----------------------------------------------------------------"
    # ---------------
    - if [ "$VERSION_YML" != "$VERSION_YML2" ]; then echo "Versions in opsi-dev-tool-yml doesnt match (project and pull-binaries section.. $VERSION_YML - $VERSION_YML2)"; exit 1; fi
    - if [ "$VERSION_YML" != "$VERSION_JSN" ]; then echo "Versions do not match for opsi-dev-tool-yml and frontend/package.json ($VERSION_YML - $VERSION_JSN) "; exit 1; else echo "Versions are equal $VERSION_YML"; fi
    - if [ "$VERSION_YML" != "$VERSION_PY" ]; then echo "Versions do not match for opsi-dev-tool-yml and backend/addon/webgui/python/const.py ($VERSION_YML - $VERSION_PY)"; exit 1; else echo "Versions are equal"; fi

preinit:transifex-up:
  # this step have to be done before building webgui
  stage: preinit
  image: docker.uib.gmbh/opsi/dev/pybuilder:deb9-py3.11
  script:
    - opsi-dev-cli -l debug transifex upload-resource frontend/locale/opsi-webgui_en.json --resource-name opsi-webgui.json
  only:
    - tags
    - main
    - v4.4
  artifacts:
    name: 'opsi-webgui-locale'
    paths:
      - frontend/locale
    expire_in: 3 day

init:npm:
  stage: init
  script:
    - cd frontend
    - *define_globals
    - npm i
  artifacts:
    paths:
      - frontend/package.json
      - frontend/node_modules/
      - frontend/.nuxt/
    expire_in: 1 day

init:transifex-down:
  # this step have to be done before building webgui
  stage: init
  image: docker.uib.gmbh/opsi/dev/pybuilder:deb9-py3.11
  script:
    - TRANSIFEX_MIN_REVIEW_RATE=0.0
    - '[ "$CI_COMMIT_TAG" = "" ] || TRANSIFEX_MIN_REVIEW_RATE=1.0'
    # - opsi-dev-cli -l debug transifex upload-resource frontend/locale/opsi-webgui_en.json --resource-name opsi-webgui.json
    # - opsi-dev-cli -l 6 transifex download-translations opsi-webgui.json opsiweb/uib-components/locale/ --min-translation-rate 1
    - rm -f frontend/locale/opsi-webgui_de.json
    - rm -f frontend/locale/opsi-webgui_fr.json
    - opsi-dev-cli -l debug transifex download-translations opsi-webgui.json frontend/locale/ --min-review-rate $TRANSIFEX_MIN_REVIEW_RATE -l de -l fr
    - chmod 666 frontend/locale/*
  only:
    - tags
    - main
    - v4.4
  artifacts:
    name: 'opsi-webgui-locale'
    paths:
      - frontend/locale
    expire_in: 3 day
init:changelogs:
  # this step have to be done before building webgui
  stage: init
  image: docker.uib.gmbh/opsi/dev/pybuilder:deb9-py3.11
  script:
    - opsi-dev-cli -l 5 changelog from-git output
    # - cp -f output/changelog.md webgui/data/.
    - chmod 666 output/*
  only:
    - tags
    - main
    - v4.4
  artifacts:
    name: 'opsi-webgui-changelogs'
    paths:
      - output
    expire_in: 1 day

