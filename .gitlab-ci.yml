test:accessibility:
  image: mcr.microsoft.com/playwright:v1.38.0-jammy
  stage: test
  dependencies:
    - init:npm
  before_script:
    - cd frontend
    - *start_webgui
  script:
    - npm run pwtest:access || exit_code=$?
    - exit $exit_code
  after_script:
    - npm run bash:delete-empty-test-results
  allow_failure: true
  only:
    - main
    - tags
  artifacts:
    name: 'opsi-webgui-test-result-accessibility'
    when: on_failure
    paths:
      - ./**/*/test-results/
      - frontend/.dev.log
    reports:
      junit: frontend/.config/test-result-pw-reporter-accessibility.xml
    expire_in: 1 day
test:usecase:
  image: mcr.microsoft.com/playwright:v1.38.0-jammy
  stage: test
  dependencies:
    - init:npm
  before_script:
    - cd frontend
    - *define_globals
    - *install_playwright
    - *start_webgui
  script:
    - npm run pwtest:usecase || exit_code=$?
    - exit $exit_code
  after_script:
    - npm run bash:delete-empty-test-results
  allow_failure: true
  only:
    - main
    - tags
  artifacts:
    name: 'opsi-webgui-test-result-usecase'
