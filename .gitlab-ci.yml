test:security:
  stage: test
  dependencies:
    - init:npm
  before_script:
    - cd frontend
    - *define_globals
  script:
    - npm install -g npm@latest
    - npm run check-blocked-packages || exit_code=$?
    # if exitcode is zero or one everything is fine (npm ls returns 1 if peer dependencies are not ok, but that is not what we want to test here..)
    - if [ -z "$exit_code" ] || [ "$exit_code" -le 1 ]; then exit 0; else exit $exit_code; fi
test:build:
  stage: test
  dependencies:
    - init:npm
  before_script:
    - cd frontend
    - *define_globals
  script:
    - npm run generate
test:languages:
  stage: test
  dependencies:
    - init:npm
    - init:transifex-down
  before_script:
    - cd frontend
    - *define_globals
  script:
    - ls -lah
    - ls -lah locale
  artifacts:
    paths:
      - frontend/locale

test:lint:
  stage: test
  dependencies:
    - init:npm
    # - init:transifex-down
  before_script:
    - cd frontend
    - *define_globals
  script:
    - npm run lint

test:i18n-additional:
  stage: test
  image: docker.uib.gmbh/opsi/dev/pybuilder:deb9-py3.11
  dependencies:
    - init:npm
  before_script:
    - cd frontend
    - *define_globals
  script:
    # - npm run lint:missing-i18n
    - python scripts/compare_translation_keys.py -s

test:tsc:
  stage: test
  dependencies:
    - init:npm
  before_script:
    - cd frontend
    - *define_globals
  script:
    - npm run tsc || exit 1

