image: node:23.0.0-bookworm-slim

stages:
  - preinit
  - init
  - test
  - build
  - upload
  - publish
  - release

.define_globals: &define_globals |
  shopt -s expand_aliases

.install_playwright: &install_playwright |
  npm i -D @playwright/test
  npx playwright install --with-deps chromium

.start_storybook: &start_storybook |
  PORT=3003 nohup npm run story > .storybook.log &

.start_webgui: &start_webgui |
  PORT=8888 nohup npm run dev > .dev.log &

.install_dev_cli: &install_dev_cli |
  export DEBIAN_FRONTEND=noninteractive
  apt update
  apt -y install debhelper osc zip
  curl -sS "${OPSIDEVTOOLS_INSTALLER_URL_LINUX_X64}" | sh
  opsi-dev-cli --version
  opsi-dev-tool --version

.prepare_backend_tests: &prepare_backend_tests |
  apt update
  echo "install stuff"
  apt -y install git
  apt -y install bc wget python3-pip python3-dev python3-venv iproute2 net-tools iputils-ping
  git clone -b v4.3 https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.uib.gmbh/uib/opsiconfd.git

  cd opsiconfd

   # Install debian packages
  export DEBIAN_FRONTEND=noninteractive
  apt update
  apt -y install debhelper osc
  apt -y install python3-dev
  apt -y install mariadb-client bc
  pip3 install --upgrade pip
  #pip3 install --trusted-host pypi.uib.gmbh --index-url http://pypi.uib.gmbh:8080/simple opsi-dev-tools
  #pip3 install poetry


  # Grant full database access to opsi user
  mysql --host=${MYSQL_HOST} --user=root --password=${MYSQL_ROOT_PASSWORD} -e "GRANT ALL ON ${MYSQL_DATABASE}.* TO '${MYSQL_USER}'@'%';"

  # Get config files from opsi-server package
  [ -e /etc/opsi ] && rm -r /etc/opsi
  [ -e ../opsi-server ] && rm -r ../opsi-server
  url=$(git remote -v | grep fetch | cut -f2 | sed s'#/opsiconfd.git.*#/opsi-server.git#')
  #branch=$(git rev-parse --abbrev-ref HEAD)
  branch=master
  GIT_TERMINAL_PROMPT=0 git clone --branch $branch $url ../opsi-server
  cp -a ../opsi-server/opsi-server_data/etc /etc/opsi

  # Configure opsiconfd
  mkdir -p /var/lib/opsi/repository /var/lib/opsi/depot

  echo "redis-internal-url = redis://redis" >> tests/data/default-opsiconfd.conf
  echo "log-level-stderr = 0" >> tests/data/default-opsiconfd.conf
  echo "log-level-file = 6" >> tests/data/default-opsiconfd.conf
  echo "log-file = /tmp/opsiconfd.log" >> tests/data/default-opsiconfd.conf
  echo "addon-dirs = [../backend/addon]" >> tests/data/default-opsiconfd.conf

  # Installing opsi test modules file
  mkdir -p /etc/opsi/licenses
  wget --header="Authorization: Bearer ${OPSILICSRV_TOKEN}" "https://opsi-license-server.uib.gmbh/api/v1/licenses/test?usage=opsiconfd-gitlab-ci" -O /etc/opsi/licenses/test.opsilic


  # linking python3 as python for compatibility
  # ln -s /usr/bin/python3 /usr/bin/python

  # Create dirs
  mkdir -p /var/log/opsi/clientconnect
  mkdir -p /var/lib/opsi/public
  mkdir -p /tftpboot

  # Install poetry
  pip3 install poetry
  poetry config experimental.new-installer false
  poetry lock --no-update
  poetry install
  poetry run opsiconfd -c tests/data/default-opsiconfd.conf -l5 setup

  # Create adminuser used in tests
  useradd adminuser
  echo "adminuser:adminuser" | chpasswd
  adduser adminuser opsiadmin

  # Start and wait for redis server
  # redis-server /etc/redis/redis.conf &
  sleep 20

.install_uv: &install_uv |
  apt update
  apt -y install curl
  curl -LsSf https://astral.sh/uv/install.sh | sh
  source $HOME/.local/bin/env
  uv self update
  export UV_PYTHON_PREFERENCE="only-managed"
  export UV_PYTHON="3.13"

.prepare_backend_minimal: &prepare_backend_minimal |
  apt update
  apt -y install git wget python3-pip python3-dev python3-venv iproute2 net-tools iputils-ping
  apt -y install mariadb-client default-libmysqlclient-dev build-essential
  apt -y install libxslt-dev python3-lxml
  apt -y install build-essential pkg-config libxml2-dev libxmlsec1-dev libxmlsec1-openssl #libpython3.??-dev

  git clone -b v4.3 https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.uib.gmbh/uib/opsiconfd.git
  cd opsiconfd
  export OPSICONFD_MAX_SESSIONS_PER_IP=20000
  export OPSICONFD_RESTORE_BACKUP_URL=https://binaryindex.uib.gmbh/development/opsi-backups/opsi.acme.corp_4.3.json
  export OPSICONFD_RESTORE_BACKUP_ALWAYS="true"
  export OPSICONFD_MYSQL_INTERNAL_URL="mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@${MYSQL_HOST}:3306/${MYSQL_DATABASE}"
  echo "OPSICONFD_MYSQL_INTERNAL_URL=${OPSICONFD_MYSQL_INTERNAL_URL}"
  export OPSICONFD_ADDON_DIRS=["../backend/addon"]
  #    echo "addon-dirs = [../backend/addon]" >> tests/data/default-opsiconfd.conf

  # Configure database access

  mysql --host=${MYSQL_HOST} --user=root --password=${MYSQL_ROOT_PASSWORD} -e "GRANT ALL ON ${MYSQL_DATABASE}.* TO 'opsi'@'%';"

  # Install dependencies
  uv self update
  uv sync --frozen

  # Configure opsiconfd
  mkdir -p /etc/opsi /var/lib/opsi/repository /var/lib/opsi/depot
  echo "redis-internal-url = redis://redis" >> tests/data/default-opsiconfd.conf
  echo "log-file = /tmp/opsiconfd.log" >> tests/data/default-opsiconfd.conf
  echo "addon-dirs = [../backend/addon]" >> tests/data/default-opsiconfd.conf
  echo "skip-setup = [files, file_permissions]" >> tests/data/default-opsiconfd.conf
  cd ..

.start_backend_minimal: &start_backend_minimal |
  cd opsiconfd
  # Setup database
  uv run opsiconfd setup --configure-mysql -c tests/data/default-opsiconfd.conf -l5

  # Start opsiconfd
  #poetry run opsiconfd -c tests/data/default-opsiconfd.conf -l5 setup &
  uv run opsiconfd -c tests/data/default-opsiconfd.conf -l5 setup &
  cd ..

.pytest: &pytest |

  [ -e /tmp/opsiconfd.log ] && rm /tmp/opsiconfd.log
  export OPSICONFD_MAX_SESSIONS_PER_IP=20000
  poetry run opsiconfd -c tests/data/default-opsiconfd.conf &
  sleep 60
  curl -I https://adminuser:adminuser@localhost:4447/admin
  echo "---------------------------------------"
  echo "Run tests"
  echo "---------------------------------------"
  exit_code=0
  pwd
  ls -la
  ls -la ../backend
  ls -la ../backend/addon
  # cp -R ../backend/tests
  poetry run pytest  --tb=short -v ../backend/tests || exit_code=$?
  if [ $exit_code -ne 0 ]; then
    echo "---------------------------------------"
    echo "opsiconfd log"
    echo "---------------------------------------"
    cat /tmp/opsiconfd.log
    exit $exit_code
  fi

.get_changed_files: &get_changed_files |
  changedFiles=$(git diff origin/v5 -r --no-commit-id --name-only | grep -i -P 'stories.js|test.component.js|test.unit.js|.vue' | grep -v 'test.component.js-snapshot')
  echo "$changedFiles"
  basenames=$(basename -s .stories.js $(basename -s .test.component.js $(basename -s .vue -a $changedFiles)))
  echo "$basenames"
  testfilesUnique=$(echo $basenames | tr ' ' '\n' | awk '!a[$0]++')
  # todo checking if each file in testfilesUnique exists
  echo "$testfilesUnique"
  cd ..

#########################################################################
######################################################################### init
#########################################################################
preinit:versions:
  stage: preinit
  image: docker.uib.gmbh/opsi/dev/pybuilder:deb9-py3.11 # cause smaller then node...
  script:
    # download yq (yml parser) https://github.com/mikefarah/yq?tab=readme-ov-file
    - wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq && chmod +x /usr/bin/yq
    - echo "----------------------------------------------------------------"
    - VERSION_YML=$(yq '.project.version' opsi-dev-tool.yml | sed -e "s/,//g" | sed "s/\"//g" | sed "s/'//g")
    - echo $VERSION_YML

    - echo "----------------------------------------------------------------"
    - VERSION_YML2=$(yq '.pull-binaries[0].version' opsi-dev-tool.yml | sed -e "s/,//g" | sed "s/\"//g" | sed "s/'//g")
    - echo $VERSION_YML2

    - echo "----------------------------------------------------------------"
    - VERSION_JSN=$(yq '.version' frontend/package.json | sed -e "s/,//g" | sed "s/\"//g" | sed "s/'//g")
    - echo $VERSION_JSN

    - echo "----------------------------------------------------------------"
    - VERSION_PY=$(cat backend/addon/webgui/python/const.py | grep "ADDON_VERSION =" | awk '{print $3}' | sed -e "s/,//g" | sed "s/\"//g" | sed "s/'//g")
    - echo $VERSION_PY

    - echo "----------------------------------------------------------------"
    - if [ "$VERSION_YML" != "$VERSION_YML2" ]; then echo "Versions in opsi-dev-tool-yml are uneuqal (project.version and pull-binaries[0].version].. $VERSION_YML - $VERSION_YML2)"; exit 1; fi
    - if [ "$VERSION_YML" != "$VERSION_JSN" ]; then echo "Versions do not match for opsi-dev-tool-yml and frontend/package.json ($VERSION_YML - $VERSION_JSN) "; exit 1; else echo "Versions are equal"; fi
    - if [ "$VERSION_YML" != "$VERSION_PY" ]; then echo "Versions do not match for opsi-dev-tool-yml and backend/addon/webgui/python/const.py ($VERSION_YML - $VERSION_PY)"; exit 1; else echo "Versions are equal"; fi

preinit:transifex-up:
  # this step have to be done before building webgui
  stage: preinit
  image: docker.uib.gmbh/opsi/dev/pybuilder:deb9-py3.11
  script:
    - opsi-dev-cli -l debug transifex upload-resource frontend/locale/opsi-webgui_en.json --resource-name opsi-webgui.json
  only:
    - tags
    - v5

init:npm:
  stage: init
  script:
    - cd frontend
    - *define_globals
    - npm i
    - npm run dev &
    - sleep 10
  artifacts:
    paths:
      - frontend/package.json
      - frontend/node_modules/
      - frontend/.nuxt/
    expire_in: 1 day

init:transifex-down:
  # this step have to be done before building webgui
  stage: init
  image: docker.uib.gmbh/opsi/dev/pybuilder:deb9-py3.11
  script:
    - TRANSIFEX_MIN_REVIEW_RATE=0.0
    - '[ "$CI_COMMIT_TAG" = "" ] || TRANSIFEX_MIN_REVIEW_RATE=1.0'
    # download all 100% translated files
    - opsi-dev-cli -l 6 transifex download-translations opsi-webgui.json frontend/locale/ --min-translation-rate 1
    - rm -f frontend/locale/opsi-webgui_de.json
    - rm -f frontend/locale/opsi-webgui_fr.json
    # download 100 reviewed files (de, fr)
    - opsi-dev-cli -l debug transifex download-translations opsi-webgui.json frontend/locale/ --min-review-rate $TRANSIFEX_MIN_REVIEW_RATE -l de -l fr
    - chmod 666 frontend/locale/*
    # at least en,de,fr have to exist
    - test -f frontend/locale/opsi-webgui_en.json && echo "Translation en exists."
    - test -f frontend/locale/opsi-webgui_de.json && echo "Translation de exists."
    - test -f frontend/locale/opsi-webgui_fr.json && echo "Translation fr exists."
  artifacts:
    paths:
      - frontend/locale
    expire_in: 3 day

init:changelogs:
  # this step have to be done before building webgui
  stage: init
  image: docker.uib.gmbh/opsi/dev/pybuilder:deb9-py3.11
  script:
    - opsi-dev-cli -l 5 changelog from-git output
    # - cp -f output/changelog.md webgui/data/.
    - chmod 666 output/*
  only:
    - tags
    - v5
    - ci/zip-dev
  artifacts:
    name: 'opsi-webgui-changelogs'
    paths:
      - output
    expire_in: 1 day

