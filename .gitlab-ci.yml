build:screenshots:docs: # with transifex
  image: mcr.microsoft.com/playwright:v1.15.2-focal
  stage: build
  dependencies:
    - init:npm
    - init:transifex
  only:
    - v4.3 # cause in main we test all files, but only chromium browser
    - tags
  before_script:
    - cd opsiweb
    - *define_globals
    - *install_playwright
    - *start_storybook
    - *start_webgui
  script:
    - cd screenshots4Docs
    - npx playwright test -c playwright-screenshots.config.js take_screenshots/  || exit_code=$?
  after_script:
    - exit $exit_code
  allow_failure: true
  artifacts:
    name: "opsi-webgui-screenshots-docs-result"
    when: always
    paths:
      - opsiweb/screenshots4Docs/screenshots
      - ./**/*/test-results/
      - opsiweb/.storybook.log
      - opsiweb/.dev.log
