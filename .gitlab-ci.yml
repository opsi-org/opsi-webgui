image: node:23.0.0-bookworm-slim

variables:
  CI: true
  #FF_NETWORK_PER_BUILD: 1
  #FF_SCRIPT_SECTIONS: 1
  DEBIAN_FRONTEND: noninteractive
  OPSI_VERSION: '4.3'
  PYTHONUNBUFFERED: 1
  UV_PYTHON: '3.13'
  UV_INSTALL_DIR: /opt/uv
  UV_PYTHON_PREFERENCE: 'only-managed'
  OPSICONFD_REDIS_INTERNAL_URL: 'redis://redis'
  #OPSICONFD_LOG_FILE: '/tmp/opsiconfd.log'
  #OPSICONFD_LOG_LEVEL_STDERR: '0'
  OPSICONFD_LOG_LEVEL_FILE: '6'
  OPSICONFD_LOG_LEVEL: '6'
  OPSICONFD_ADDON_DIRS: '../backend/addon'
  OPSICONFD_MAX_SESSIONS_PER_IP: '20000'
  MYSQL_ROOT_PASSWORD: 'opsi'
  MYSQL_DATABASE: 'opsitest'
  MYSQL_USER: 'opsi'
  MYSQL_PASSWORD: 'opsi'
  MYSQL_HOST: 'mysql'
  OPSI_ADMINUSER: 'adminuser'
  OPSI_ADMINPW: 'adminuser'
  MAIN: main

stages:
  - preinit
  - init
  - test
  - build
  - upload
  - publish
  - release

.define_globals: &define_globals |
  shopt -s expand_aliases

.install_playwright: &install_playwright |
  npm i -D @playwright/test
  npx playwright install --with-deps chromium

.start_storybook: &start_storybook |
  PORT=3003 nohup npm run story > .storybook.log &

.start_webgui: &start_webgui |
  PORT=8888 nohup npm run dev > .dev.log &

.install_dev_cli: &install_dev_cli |
  apt update
  apt -y install debhelper osc zip
  curl -sS "${OPSIDEVTOOLS_INSTALLER_URL_LINUX_X64}" | sh
  opsi-dev-cli --version
  opsi-dev-tool --version

.install_uv: &install_uv |
  apt update
  apt -y install curl
  curl -LsSf https://astral.sh/uv/install.sh | sh
  # in uv install dir
  source $UV_INSTALL_DIR/env
  uv self update

.prepare_backend: &prepare_backend |
  apt update
  echo ">>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> install stuff"
  apt -y install debhelper osc bc git wget python3 python3-pip python3-dev python3-venv iproute2 net-tools iputils-ping
  apt -y install mariadb-client default-libmysqlclient-dev build-essential
  apt -y install libxslt-dev python3-lxml
  apt -y install build-essential pkg-config libxml2-dev libxmlsec1-dev libxmlsec1-openssl
  git clone -b "v$OPSI_VERSION" "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.uib.gmbh/uib/opsiconfd.git"

  cd opsiconfd
  echo ">>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> configure opsiconfd"
  # Get config files for opsiconfd
  [ -e /etc/opsi ] && rm -r /etc/opsi
  cp -a opsiconfd_data/etc /etc/opsi

  # Configure opsiconfd
  mkdir -p /var/lib/opsi/repository /var/lib/opsi/depot
  export OPSICONFD_MYSQL_INTERNAL_URL="mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@${MYSQL_HOST}:3306/${MYSQL_DATABASE}"
  #export OPSICONFD_MYSQL_INTERNAL_URL="mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@${MYSQL_HOST}:3306/${MYSQL_DATABASE}?ssl=true"
  echo "mysql-internal-url = ${OPSICONFD_MYSQL_INTERNAL_URL}" >> tests/data/default-opsiconfd.conf
  echo "mysql internal url: $OPSICONFD_MYSQL_INTERNAL_URL"
  echo ">>>>> opsiconfd config"
  cat tests/data/default-opsiconfd.conf

  echo ">>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> setup users and groups"
  groupadd -g 2001 opsifileadmins
  groupadd -g 2002 opsiadmin
  useradd --system -g opsifileadmins -d /var/lib/opsi -s /bin/bash opsiconfd -G opsiadmin

  useradd "${OPSI_ADMINUSER}"
  echo "${OPSI_ADMINUSER}:${OPSI_ADMINPW}" | chpasswd
  adduser "${OPSI_ADMINUSER}" opsiadmin

  # Installing opsi test modules file
  echo ">>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> get license"
  mkdir -p /etc/opsi/licenses
  wget --header="Authorization: Bearer ${OPSILICSRV_TOKEN}" "https://opsi-license-server.uib.gmbh/api/v1/licenses/test?usage=opsiconfd-gitlab-ci" -O /etc/opsi/licenses/test.opsilic

  # Create dirs
  mkdir -p /var/log/opsi/clientconnect
  mkdir -p /var/lib/opsi/public
  mkdir -p /tftpboot

  # Grant full database access to opsi user
  echo ">>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> configure mysql"
  #MYSQL_GRANT="GRANT ALL ON ${MYSQL_DATABASE}.* TO '${MYSQL_USER}'@'%';"
  #mysql --host="${MYSQL_HOST}" --user=root --password="${MYSQL_ROOT_PASSWORD}" -e "GRANT ALL ON ${MYSQL_DATABASE}.* TO '${MYSQL_USER}'@'%';"
  #mysql --host="$MYSQL_HOST" --user=root --password="$MYSQL_ROOT_PASSWORD" -e "$MYSQL_GRANT"
  mysql --host=mysql --user=root --password=opsi -e "GRANT ALL ON opsitest.* TO 'opsi'@'%';"
  echo "internal url: $OPSICONFD_MYSQL_INTERNAL_URL"

  # install opsiconfd
  echo ">>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> install python dependencies"
  uv sync --frozen
  echo ">>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> setup opsiconfd"
  echo "opsiconfd loglevel: ${OPSICONFD_LOG_LEVEL} using: ${MAIN}"
  uv run opsiconfd -c tests/data/default-opsiconfd.conf setup -l6
  echo ">> configure mysql"
  #uv run opsiconfd -c tests/data/default-opsiconfd.conf setup --configure-mysql


  # Start and wait for redis server
  # echo ">>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> start redis"
  # redis-server /etc/redis/redis.conf &
  sleep 20
  cd ..

.start_backend: &start_backend |
  cd opsiconfd
  # Start opsiconfd
  echo ">>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> start opsiconfd"
  echo "mysql internal url: $OPSICONFD_MYSQL_INTERNAL_URL"
  uv run opsiconfd  -c tests/data/default-opsiconfd.conf  -l6 &
  sleep 60
  curl -I "https://${OPSI_ADMINUSER}:${OPSI_ADMINPW}@localhost:4447/admin"
  cd ..

.pytest: &pytest |
  echo "---------------------------------------"
  echo "Run tests"
  echo "---------------------------------------"
  exit_code=0
  pwd
  ls -la
  ls -la ../backend
  ls -la ../backend/addon
  # cp -R ../backend/tests
  uv run pytest  --tb=short -v ../backend/tests || exit_code=$?
  if [ $exit_code -ne 0 ]; then
    echo "---------------------------------------"
    echo "opsiconfd log"
    echo "---------------------------------------"
    cat /tmp/opsiconfd.log
    exit $exit_code
  fi

.get_changed_files: &get_changed_files |
  changedFiles=$(git diff origin/v5 -r --no-commit-id --name-only | grep -i -P 'stories.js|test.component.js|test.unit.js|.vue' | grep -v 'test.component.js-snapshot')
  echo "$changedFiles"
  basenames=$(basename -s .stories.js $(basename -s .test.component.js $(basename -s .vue -a $changedFiles)))
  echo "$basenames"
  testfilesUnique=$(echo $basenames | tr ' ' '\n' | awk '!a[$0]++')
  # todo checking if each file in testfilesUnique exists
  echo "$testfilesUnique"
  cd ..

#########################################################################
######################################################################### init
#########################################################################
preinit:versions:
  stage: preinit
  image: docker.uib.gmbh/opsi/dev/pybuilder:deb9-py3.11 # cause smaller then node...
  script:
    # download yq (yml parser) https://github.com/mikefarah/yq?tab=readme-ov-file
    - wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq && chmod +x /usr/bin/yq
    - echo "----------------------------------------------------------------"
    - VERSION_YML=$(yq '.project.version' opsi-dev-tool.yml | sed -e "s/,//g" | sed "s/\"//g" | sed "s/'//g")
    - echo $VERSION_YML

    - echo "----------------------------------------------------------------"
    - VERSION_YML2=$(yq '.pull-binaries[0].version' opsi-dev-tool.yml | sed -e "s/,//g" | sed "s/\"//g" | sed "s/'//g")
    - echo $VERSION_YML2

    - echo "----------------------------------------------------------------"
    - VERSION_JSN=$(yq '.version' frontend/package.json | sed -e "s/,//g" | sed "s/\"//g" | sed "s/'//g")
    - echo $VERSION_JSN

    - echo "----------------------------------------------------------------"
    - VERSION_PY=$(cat backend/addon/webgui/python/const.py | grep "ADDON_VERSION =" | awk '{print $3}' | sed -e "s/,//g" | sed "s/\"//g" | sed "s/'//g")
    - echo $VERSION_PY

    - echo "----------------------------------------------------------------"
    - if [ "$VERSION_YML" != "$VERSION_YML2" ]; then echo "Versions in opsi-dev-tool-yml are uneuqal (project.version and pull-binaries[0].version].. $VERSION_YML - $VERSION_YML2)"; exit 1; fi
    - if [ "$VERSION_YML" != "$VERSION_JSN" ]; then echo "Versions do not match for opsi-dev-tool-yml and frontend/package.json ($VERSION_YML - $VERSION_JSN) "; exit 1; else echo "Versions are equal"; fi
    - if [ "$VERSION_YML" != "$VERSION_PY" ]; then echo "Versions do not match for opsi-dev-tool-yml and backend/addon/webgui/python/const.py ($VERSION_YML - $VERSION_PY)"; exit 1; else echo "Versions are equal"; fi

preinit:transifex-up:
  # this step have to be done before building webgui
  stage: preinit
  image: docker.uib.gmbh/opsi/dev/pybuilder:deb9-py3.11
  script:
    - opsi-dev-cli -l debug transifex upload-resource frontend/locale/opsi-webgui_en.json --resource-name opsi-webgui.json
  only:
    - tags
    - v5

init:npm:
  stage: init
  script:
    - cd frontend
    - *define_globals
    - npm i
    - npm run dev &
    - sleep 10
  artifacts:
    paths:
      - frontend/package.json
      - frontend/node_modules/
      - frontend/.nuxt/
    expire_in: 1 day

init:transifex-down:
  # this step have to be done before building webgui
  stage: init
  image: docker.uib.gmbh/opsi/dev/pybuilder:deb9-py3.11
  script:
    - TRANSIFEX_MIN_REVIEW_RATE=0.0
    - '[ "$CI_COMMIT_TAG" = "" ] || TRANSIFEX_MIN_REVIEW_RATE=1.0'
    # download all 100% translated files
    - opsi-dev-cli -l 6 transifex download-translations opsi-webgui.json frontend/locale/ --min-translation-rate 1
    - rm -f frontend/locale/opsi-webgui_de.json
    - rm -f frontend/locale/opsi-webgui_fr.json
    # download 100 reviewed files (de, fr)
    - opsi-dev-cli -l debug transifex download-translations opsi-webgui.json frontend/locale/ --min-review-rate $TRANSIFEX_MIN_REVIEW_RATE -l de -l fr
    - chmod 666 frontend/locale/*
    # at least en,de,fr have to exist
    - test -f frontend/locale/opsi-webgui_en.json && echo "Translation en exists."
    - test -f frontend/locale/opsi-webgui_de.json && echo "Translation de exists."
    - test -f frontend/locale/opsi-webgui_fr.json && echo "Translation fr exists."
  artifacts:
    paths:
      - frontend/locale
    expire_in: 3 day

init:changelogs:
  # this step have to be done before building webgui
  stage: init
  image: docker.uib.gmbh/opsi/dev/pybuilder:deb9-py3.11
  script:
    - opsi-dev-cli -l 5 changelog from-git output
    # - cp -f output/changelog.md webgui/data/.
    - chmod 666 output/*
  only:
    - tags
    - v5
    - ci/zip-dev
  artifacts:
    name: 'opsi-webgui-changelogs'
    paths:
      - output
    expire_in: 1 day

#########################################################################
######################################################################### test
#########################################################################
test:security:
  stage: test
  dependencies:
    - init:npm
  before_script:
    - cd frontend
    - *define_globals
  script:
    - npm install -g npm@latest
    - npm run check-blocked-packages || exit_code=$?
    # if exitcode is zero or one everything is fine (npm ls returns 1 if peer dependencies are not ok, but that is not what we want to test here..)
    - if [ -z "$exit_code" ] || [ "$exit_code" -le 1 ]; then exit 0; else exit $exit_code; fi
test:build:
  stage: test
  dependencies:
    - init:npm
  before_script:
    - cd frontend
    - *define_globals
  script:
    - npm run generate
test:languages:
  stage: test
  dependencies:
    - init:npm
    - init:transifex-down
  before_script:
    - cd frontend
    - *define_globals
  script:
    - ls -lah
    - ls -lah locale
  artifacts:
    paths:
      - frontend/locale

test:lint:
  stage: test
  dependencies:
    - init:npm
    # - init:transifex-down
  before_script:
    - cd frontend
    - *define_globals
  script:
    - npm run lint

test:i18n-additional:
  stage: test
  image: docker.uib.gmbh/opsi/dev/pybuilder:deb9-py3.11
  dependencies:
    - init:npm
  before_script:
    - cd frontend
    - *define_globals
  script:
    # - npm run lint:missing-i18n
    - python scripts/compare_translation_keys.py -s

test:tsc:
  stage: test
  dependencies:
    - init:npm
  before_script:
    - cd frontend
    - *define_globals
  script:
    - npm run tsc || exit 1

.test:backend-pytest:
  image: docker.uib.gmbh/opsi/dev/pybuilder:deb9-py3.11
  services:
    - name: mysql:latest
      command:
        - --max_connections=1000
    - name: redislabs/redistimeseries:latest
      alias: redis
  script:
    - *install_dev_cli
    - *prepare_backend
    - echo "##########################################"
    - echo "##################pytest##################"
    - echo "##########################################"
    - *pytest
  allow_failure: true ##### TODO remove again

#########################################################################
######################################################################### build
#########################################################################
build:screenshot:
  stage: build
  image: mcr.microsoft.com/playwright:v1.56.0-noble
  dependencies:
    - init:npm
    - init:transifex-down
  services:
    - name: mysql:latest
      command:
        - --max_connections=1000
      alias: mysql
    - name: redislabs/redistimeseries:latest
      alias: redis
    #FF_NETWORK_PER_BUILD: true
  script:
    - *install_uv
    - *prepare_backend
    - cd frontend
    - bash scripts/build_production_local.sh webgui Webgui "$(pwd)/.." copydata
    - sleep 30
    - cd ..
    - *start_backend
    # start opsidoc screenshots
    - cd frontend
    - mkdir test-results
    - npm ci
    - npx playwright install-deps
    - npx playwright test tests/screenshot/
  artifacts:
    paths:
      - frontend/screenshots/opsidoc
      - frontend/test-results/
      # '${OPSICONFD_LOG_FILE}'
      - /tmp/opsiconfd.log
    expire_in: 2 days
    when: always
  only:
    - tags
    - v5
    - test/opsidocs

build:static:app: # with transifex
  stage: build
  dependencies:
    - init:npm
    - init:transifex-down
    # - test:lint # todo activate again for main
  script:
    - cd frontend
    - npm i @nuxt/typescript-build
    - *define_globals
    - npm run generate
  artifacts:
    paths:
      - frontend/dist # not used...?
    expire_in: 3 day
  only:
    - tags
    - v5

build:zip: # with transifex
  stage: build
  dependencies:
    - init:npm
    - init:transifex-down
    - init:changelogs
    - build:static:app
  script:
    - *install_dev_cli
    - pwd && ls -la frontend
    - bash "$(pwd)/frontend/scripts/build_production_local.sh" webgui Webgui $(pwd) no-install
    - ls -lah webgui # debug
  only:
    - tags
    - v5
    - ci/zip-dev
  artifacts:
    name: 'opsi-webgui'
    paths:
      - frontend/locale
      - webgui
    expire_in: 7 day

build:zip:dev: # with transifex
  stage: build
  dependencies:
    - init:npm
    - init:transifex-down
    - init:changelogs
  script:
    - *install_dev_cli
    - *define_globals
    - pwd && ls -la frontend
    - ls -lah frontend/locale
    - echo "building opsi-webgui-dev.zip"
    - bash "$(pwd)/frontend/scripts/build_production_local.sh" webgui-dev Webgui-Dev $(pwd) no-install
    - ls -lah webgui-dev # debug
  artifacts:
    name: 'opsi-webgui-dev'
    paths:
      - frontend/locale
      - webgui-dev
    expire_in: 7 day

#########################################################################
######################################################################### publish
#########################################################################

publish:obs_int:
  stage: publish
  dependencies:
    - build:static:app
  image: docker.uib.gmbh/opsi/dev/pybuilder:deb9-py3.11
  script:
    - opsi-dev-tool -l debug --obs-update-package https://obs.uib.gmbh home:uibmz:opsi:4.4:development
  only:
    - tags

publish:obs_ext:
  stage: publish
  image: docker.uib.gmbh/opsi/dev/pybuilder:deb9-py3.11
  dependencies:
    - init:changelogs
    - build:zip # todo which is really needed?
    - build:static:app # todo which is really needed?
  script:
    - ls -la
    - ls -la frontend
    - ls -la webgui
    - ls -la output
    # - opsi-dev-cli -l 5 changelog from-git output
    - opsi-dev-tool -l debug --obs-update-package https://build.opensuse.org home:uibmz:opsi:4.4:development
    - opsi-dev-cli -l 6 release-service register-package-version opsi-webgui SERVER_PACKAGE --changelog-file output/changelog.md
    - opsi-dev-cli -l 6 release-service push-repository-state opsi-webgui SERVER_PACKAGE SERVER_PACKAGE-4.4-development
  only:
    - tags
  artifacts:
    paths:
      - output
    expire_in: 1 day
  # Copy to experimental via release-tui

publish:binary-index:
  stage: publish
  dependencies:
    - build:zip
    - init:changelogs
  image: docker.uib.gmbh/opsi/dev/pybuilder:deb9-py3.11
  script:
    - ls -la
    - ls -la frontend
    - ls -la webgui
    - ls -la output
    # - opsi-dev-cli -l 5 changelog from-git output # done during init
    - cat output/changelog.md
    - opsi-dev-cli -l 6 binary push opsi-webgui.zip --product=opsi-webgui.zip # pushing as opsi-webgui.zip now
    - opsi-dev-cli -l 6 release-service register-package-version opsi-webgui.zip TOOL --changelog-file output/changelog.md --files=opsi-webgui.zip
  only:
    - tags
