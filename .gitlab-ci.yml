test:components:changes:
  image: mcr.microsoft.com/playwright:v1.15.2-focal
  stage: test
  dependencies:
    - init:npm
  except:
    - cicd
    - tags # cause in tags we test all browsers (and all files)
    - v4.3 # cause in main we test all files
  only:
    changes:
      - opsiweb/pages/*
      - opsiweb/components/*
      - opsiweb/uib-components/*
  before_script:
    - cd opsiweb
    - *define_globals
    - *install_playwright
    - *get_changed_files
    - echo "$testfilesUnique"
    - *start_storybook
    - *start_webgui
    - sleep 120
  script:
    - npm run test:all:components $testfilesUnique || exit_code=$?
    - exit $exit_code
  after_script:
    - npm run test:all:delete-empty-results
  allow_failure: true
  artifacts:
    name: "opsi-webgui-test-result-components"
    when: on_failure
    paths:
      - ./**/*/test-results/
      - opsiweb/.storybook.log
      - opsiweb/.dev.log
    reports:
      junit: ./opsiweb/.config/test-result-pw-reporter-components.xml
    expire_in: 1 day
test:components:
  image: mcr.microsoft.com/playwright:v1.15.2-focal
  stage: test
  dependencies:
    - init:npm
  only:
    - v4.3 # cause in main we test all files, but only chromium browser
    - tags
  before_script:
    - cd opsiweb
    - *define_globals
    - *install_playwright
    - *start_storybook
    - *start_webgui
    - sleep 60
  script:
    - npm run test:all:components | tee .tmpRESULT
    - exit_code=${PIPESTATUS[0]}
    - exit $exit_code
  after_script:
    - cd opsiweb
    - scripts/playwright_coverage.sh .tmpRESULT
    - npm run test:all:delete-empty-results
  allow_failure: true
  coverage: /TESTED FILES\s*:\s*([^%]+)/
  artifacts:
    name: "opsi-webgui-test-result-components"
    when: on_failure
    paths:
      - ./**/*/test-results/
      - opsiweb/.storybook.log
      - opsiweb/.dev.log
      - opsiweb/.tmpRESULT
    reports:
      junit: ./opsiweb/test-result-pw-reporter-components.xml
    expire_in: 3 day
