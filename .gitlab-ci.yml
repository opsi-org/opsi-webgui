    - ls -lah webgui # debug
    - ls -lah webgui/data # debug
    - ls -lah frontend/locale
  only:
    - tags
    - main
    - v4.4
  artifacts:
    name: 'opsi-webgui'
    paths:
      - webgui
    expire_in: 7 day

