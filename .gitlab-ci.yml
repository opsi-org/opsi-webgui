# =============================================================================
# opsi-webgui GitLab CI/CD Pipeline
#
# STAGES:
#   setup    -> Install deps, i18n, changelog, versions
#   validate -> Lint, types, unit tests, e2e tests, backend tests, security
#   build    -> Build addon package
#   release  -> SBOM, publish (tags only)
# =============================================================================

image: node:26.3-bookworm-slim

variables:
  CI: 'true'
  DEBIAN_FRONTEND: noninteractive

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages: [setup, validate, build, release]

# TEMPLATES
.pybuilder:
  image: docker.uib.gmbh/opsi/dev/pybuilder:deb9-py3.11

.only-tags:
  rules:
    - if: $CI_COMMIT_TAG

.node:
  before_script:
    - npm install -g corepack
    - corepack enable pnpm

.install-devtools: &install-devtools |
  apt update && apt -y install curl zip wget
  curl -sS "${OPSIDEVTOOLS_INSTALLER_URL_LINUX_X64}" | sh

.clone-opsiconfd: &clone-opsiconfd |
  command -v git >/dev/null 2>&1 || apk add --no-cache git
  OPSICONFD_REF="${OPSICONFD_REF:-v4.3}"
  OPSICONFD_REPO_URL="${OPSICONFD_REPO_URL:-https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.uib.gmbh/uib/opsiconfd.git}"
  if [ ! -d docker/opsiconfd/.git ]; then
    echo "Cloning opsiconfd ($OPSICONFD_REF) into docker/opsiconfd..."
    rm -rf docker/opsiconfd
    git clone --depth 1 --branch "$OPSICONFD_REF" "$OPSICONFD_REPO_URL" docker/opsiconfd
  else
    echo "docker/opsiconfd already present - reusing."
  fi

# SETUP
setup:deps:
  stage: setup
  extends: .node
  script:
    - cd frontend && pnpm install --frozen-lockfile && pnpm run setup:nuxt
  artifacts:
    paths: [frontend/node_modules/, frontend/.nuxt/]
    expire_in: 1 day

# Pre-build the SPA ONCE here so the e2e container does not run `pnpm generate` on every job.
setup:spa:
  stage: setup
  extends: .node
  needs: [setup:deps]
  script: cd frontend && pnpm run generate
  artifacts:
    paths: [frontend/.output/public/]
    expire_in: 1 day

setup:i18n:
  stage: setup
  extends: .pybuilder
  before_script:
    - opsi-dev-cli self upgrade
  script:
    - RATE=0.0 && [ "$CI_COMMIT_TAG" != "" ] && RATE=1.0
    - opsi-dev-cli -l 6 transifex upload-resource frontend/i18n/locales/opsi-webgui_en.json --resource-name opsi-webgui.json || true
    - opsi-dev-cli -l 6 transifex download-translations opsi-webgui.json frontend/i18n/locales/ --language de --language fr --min-translation-rate $RATE || true
    - chmod -R 666 frontend/i18n/locales/* || true
    - ls -lah frontend/i18n/locales/
  artifacts:
    paths: [frontend/i18n/locales/]
    expire_in: 3 days
  rules:
    - when: manual
      allow_failure: true

setup:changelog:
  stage: setup
  extends: .pybuilder
  script:
    - opsi-dev-cli -l 5 changelog from-git output
    - chmod 666 output/*
  artifacts:
    paths: [output/]
    expire_in: 1 day

setup:versions:
  stage: setup
  extends: .pybuilder
  script:
    - wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq && chmod +x /usr/bin/yq
    - |
      V_YML=$(yq '.project.version' opsi-dev-tool.yml | tr -d '"')
      V_PKG=$(yq '.version' frontend/package.json | tr -d '"')
      V_PY=$(grep "ADDON_VERSION =" backend/webgui/python/const.py | awk '{print $3}' | tr -d '"')
      echo "Versions: yml=$V_YML pkg=$V_PKG py=$V_PY"
      [ "$V_YML" = "$V_PKG" ] && [ "$V_YML" = "$V_PY" ] || { echo "ERROR: Version mismatch"; exit 1; }

setup:patch-version:
  # patch version in version_files and set PACKAGE_VERSION
  # For commits: append pipeline ID (e.g., 1.0.0~12345)
  # For tags: use version as-is (e.g., 1.0.0)
  stage: setup
  extends: .pybuilder
  before_script:
    - opsi-dev-cli self upgrade # min 1.61.0
  script:
    - |
      echo "Init Version (dev-tool version: $(opsi-dev-cli --version))"
      BASE_VERSION=$(opsi-dev-cli project info version)
      if [ -z "${CI_COMMIT_TAG}" ]; then
        # Not a tag: append pipeline ID
        PACKAGE_VERSION="${BASE_VERSION}~${CI_PIPELINE_ID}"
        echo "Patching version from $BASE_VERSION to: $PACKAGE_VERSION (commit build)"
        opsi-dev-cli project patch-versions $PACKAGE_VERSION
      else
        # Tag: use version as-is
        PACKAGE_VERSION="${BASE_VERSION}"
        echo "Using version: $PACKAGE_VERSION (tag build)"
        opsi-dev-cli project patch-versions $PACKAGE_VERSION
      fi
      echo "Version patching complete!"
      echo "PACKAGE_VERSION=${PACKAGE_VERSION}" > build.env
      cat build.env
  artifacts:
    paths:
      # all paths from version_files
      - opsi-dev-tool.yml
      - frontend/package.json
      - backend/webgui/python/const.py
    expire_in: 1 day
    reports:
      dotenv: build.env

# VALIDATE
validate:lint:
  stage: validate
  extends: .node
  needs: [setup:deps]
  script: cd frontend && pnpm run lint

validate:format:
  stage: validate
  extends: .node
  needs: [setup:deps]
  script: cd frontend && pnpm run format:check

validate:types:
  stage: validate
  extends: .node
  needs: [setup:deps]
  script: cd frontend && pnpm run typecheck

validate:backend-style:
  extends: .docker-test
  variables:
    COMPOSE_PROJECT_NAME: webgui-backend-style-$CI_JOB_ID
  script:
    - |
      docker run --rm \
        -v "$LOCAL_WORKSPACE_DIR:/workspace" \
        -w /workspace \
        opsi-webgui-dev:latest \
        bash -lc '
          cd /workspace/docker/opsiconfd
          uv sync
          cd /workspace
          /workspace/docker/opsiconfd/.venv/bin/python -m ruff format --check backend
          /workspace/docker/opsiconfd/.venv/bin/python -m ruff check backend
          find backend -name "*.py" -print0 | xargs -0 /workspace/docker/opsiconfd/.venv/bin/python -m py_compile
        '

# Frontend unit tests (vitest)
validate:unit:
  stage: validate
  extends: .node
  needs: [setup:deps]
  script: cd frontend && pnpm run test:unit:coverage
  coverage: '/Lines\s*:\s*([\d.]+)%/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - frontend/coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml

# -----------------------------------------------------------------------------
# Docker-based integration tests (backend pytest + Playwright e2e).
# -----------------------------------------------------------------------------
.docker-test:
  stage: validate
  tags:
    - docker-x64
  image: docker
  needs: []
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  variables:
    OPSI_BACKUP_URL: https://binaryindex.uib.gmbh/development/opsi-backups/opsi.acme.corp_4.3.json
  before_script:
    - CONTAINER_ID=$(docker ps -q -f "label=com.gitlab.gitlab-runner.job.id=$CI_JOB_ID" -f "label=com.gitlab.gitlab-runner.type=build")
    - export LOCAL_WORKSPACE_DIR="$(docker inspect "$CONTAINER_ID" -f '{{ range .Mounts }}{{ if eq .Destination "/builds" }}{{ .Source }}{{ end }}{{ end }}')/${CI_PROJECT_PATH}"
    - echo "LOCAL_WORKSPACE_DIR=$LOCAL_WORKSPACE_DIR"
    - |
      cat > docker/.env <<EOF
      OPSI_HOSTNAME=opsi.test.local
      OPSI_DOMAIN=test.local
      OPSICONFD_PORT=4447
      USER=root
      UID=0
      ADDON_NAME=webgui
      ADDON_ID=webgui
      LOCAL_WORKSPACE_DIR=$LOCAL_WORKSPACE_DIR
      EOF
    - *clone-opsiconfd
    - docker compose -f docker/docker-compose.yml build --pull opsi-webgui-dev
  after_script:
    - docker compose -f docker/docker-compose.test.yml logs > docker-test.log 2>&1 || true
    - docker compose -f docker/docker-compose.test.yml down -v || true

validate:backend:
  extends: .docker-test
  retry:
    max: 1
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure
  variables:
    COMPOSE_PROJECT_NAME: webgui-be-$CI_JOB_ID
  script:
    - docker compose -f docker/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from backend-tests opsiconfd backend-tests
  after_script:
    - docker compose -f docker/docker-compose.test.yml logs > docker-test.log 2>&1 || true
    - docker compose -f docker/docker-compose.test.yml down -v || true
    - |
      if [ ! -f backend/coverage.xml ]; then
        cat > backend/coverage.xml <<'EOF'
        <?xml version="1.0" ?>
        <coverage version="1.0" timestamp="0" lines-valid="0" lines-covered="0" line-rate="0" branches-valid="0" branches-covered="0" branch-rate="0" complexity="0">
          <sources>
            <source>/builds/${CI_PROJECT_PATH}/backend</source>
          </sources>
          <packages />
        </coverage>
        EOF
      fi
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+)%/'
  artifacts:
    when: always
    paths: [docker-test.log, backend/coverage.xml]
    expire_in: 7 days
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual
      allow_failure: true

# Smoke e2e (DE / light / desktop / Chromium) against a real opsiconfd.
validate:e2e:smoke:
  extends: .docker-test
  needs: [setup:spa, validate:backend]
  variables:
    COMPOSE_PROJECT_NAME: webgui-e2e-$CI_JOB_ID
  script:
    - mkdir -p backend/webgui/data/app && cp -r frontend/.output/public/. backend/webgui/data/app/ 2>/dev/null || true
    - docker compose -f docker/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from e2e opsiconfd e2e
  artifacts:
    when: always
    paths: [frontend/test-results/, screenshots/, docker-test.log]
    reports:
      junit: frontend/test-results/junit.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      allow_failure: false
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      allow_failure: false
    - when: manual
      allow_failure: true

# Full e2e matrix: nightly schedule + tags (all locales/themes/viewports/browsers).
validate:e2e:full:
  extends: .docker-test
  needs:
    - job: setup:spa
    - job: validate:backend
      optional: true
  retry:
    max: 1
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure
  variables:
    COMPOSE_PROJECT_NAME: webgui-e2e-$CI_JOB_ID
    E2E_PIPELINE_SOURCE: schedule
  script:
    - mkdir -p backend/webgui/data/app && cp -r frontend/.output/public/. backend/webgui/data/app/ 2>/dev/null || true
    - docker compose -f docker/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from e2e opsiconfd e2e
  artifacts:
    when: always
    paths: [frontend/test-results/, screenshots/, docker-test.log]
    reports:
      junit: frontend/test-results/junit.xml
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_TAG

# Dependency vulnerability audit
validate:audit:
  stage: validate
  extends: .node
  needs: [setup:deps]
  script: cd frontend && pnpm audit --audit-level=high

# Supply-chain check: fail if any dependency runs an UNAPPROVED install/build
validate:install-scripts:
  stage: validate
  extends: .node
  needs: [setup:deps]
  script:
    - cd frontend
    - |
      OUTPUT=$(pnpm install --frozen-lockfile --force 2>&1)
      echo "$OUTPUT"
      if echo "$OUTPUT" | grep -qi "Ignored build scripts"; then
        echo ""
        echo "ERROR: Unreviewed dependency build scripts found."
        echo "Review them and add to frontend/pnpm-workspace.yaml onlyBuiltDependencies."
        exit 1
      fi
      echo "All dependency build scripts are reviewed and approved."

# BUILD
build:addon:
  stage: build
  extends: .node
  needs:
    [
      setup:deps,
      validate:format,
      validate:lint,
      validate:types,
      validate:backend-style,
      validate:audit,
      { job: setup:patch-version, optional: true },
      { job: setup:changelog, optional: true },
    ]
  script:
    - apt update && apt -y install zip
    - bash "$(pwd)/scripts/build_addon.sh" webgui "OPSI-WebGUI" "$(pwd)"
    - ls -lah opsi-webgui.zip webgui/
  artifacts:
    name: 'opsi-webgui-${PACKAGE_VERSION}'
    paths: [opsi-webgui.zip, webgui/]
    expire_in: 7 days

# RELEASE (tags only)
release:sbom:
  stage: release
  extends: [.node, .only-tags]
  needs: [setup:deps]
  script: cd frontend && pnpm run sbom && cp ../sbom.cyclonedx.json .
  artifacts:
    paths: [frontend/sbom.cyclonedx.json]
    expire_in: 30 days
    reports:
      cyclonedx: frontend/sbom.cyclonedx.json

release:binary-index:
  stage: release
  extends: [.pybuilder, .only-tags]
  needs: [build:addon, setup:versions, release:sbom, { job: setup:changelog, optional: true }]
  script:
    - opsi-dev-cli self upgrade
    - opsi-dev-cli -l 6 binary push opsi-webgui.zip --product=opsi-webgui.zip
    - '[ -f output/changelog.md ] && opsi-dev-cli -l 6 release-service register-package-version opsi-webgui.zip TOOL --changelog-file output/changelog.md --files=opsi-webgui.zip --sbom-file frontend/sbom.cyclonedx.json || true'

release:obs-external:
  stage: release
  extends: [.pybuilder, .only-tags]
  needs: [build:addon, setup:versions, { job: setup:changelog, optional: true }]
  script:
    - opsi-dev-cli self upgrade
    - opsi-dev-cli -l info packaging obs update-package https://build.opensuse.org home:uibmz:opsi:4.3:development
    - |
      [ -f output/changelog.md ] && {
        opsi-dev-cli -l 6 release-service register-package-version opsi-webgui SERVER_PACKAGE --changelog-file output/changelog.md
        opsi-dev-cli -l 6 release-service push-repository-state opsi-webgui SERVER_PACKAGE SERVER_PACKAGE-4.3-development
      } || true
