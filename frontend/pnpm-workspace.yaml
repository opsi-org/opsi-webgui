# pnpm 10 reads dependency overrides from here (no longer from package.json's  "pnpm.overrides").
overrides:
  # Security (pnpm audit):
  jsonata: '>=2.2.0'
  esbuild: '>=0.28.1'
  tar: '>=7.5.16'
  # vite-plugin-checker 0.14.x is published broken (missing dist/@runtime/main.js), which crashes `nuxt dev`.
  vite-plugin-checker: '0.13.0'

# Reviewed allow-list of dependencies permitted to run install/build scripts.
# These are the only packages that ship build scripts (native binaries); all
# other lifecycle scripts stay blocked by pnpm's default-deny. CI
# (validate:install-scripts) fails if a NEW, unreviewed build script appears.
onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - vue-demi

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  vue-demi: true
