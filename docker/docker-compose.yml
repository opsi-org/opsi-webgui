services:
  opsi-webgui-dev:
    hostname: ${OPSI_HOSTNAME}
    image: opsi-webgui-dev:latest
    env_file: .env
    cap_add:
      - SYS_PTRACE
    build:
      context: ../
      dockerfile: ./docker/Dockerfile
      args:
        - USER
        - UID
        - ADDON_NAME
        - ADDON_ID
    volumes:
      - ${LOCAL_WORKSPACE_DIR:-..}:/workspace
    ports:
      - "${OPSICONFD_PORT:-4447}:${OPSICONFD_PORT:-4447}" # opsiconfd
      - "${ADDON_DEV_PORT:-3000}:${ADDON_DEV_PORT:-3000}" # webgui
    environment:
      MYSQL_ROOT_PASSWORD: opsi
      MYSQL_DATABASE: opsi
      MYSQL_USER: opsi
      MYSQL_PASSWORD: opsi
      MYSQL_HOST: localhost
      OPSICONFD_PORT: ${OPSICONFD_PORT:-4447}
      ADDON_DEV_PORT: ${ADDON_DEV_PORT:-3000}
      OPSICONFD_ADDON_DIRS: '[/var/lib/opsiconfd/addons]'
    entrypoint: ['/entrypoint.sh']
