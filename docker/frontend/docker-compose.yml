version: '3.8'

include:
  - path: ./opsi-docker/opsi-server/docker-compose-env.yml
    env_file:
      # - .devcontainer/opsi-docker/opsi-server/opsi-server.env
      # - .devcontainer/.env
      - .env
      - ./opsi-docker/opsi-server/opsi-server.env

services:
  opsi-webgui-frontend-dev:
    env_file:
      - .env # needs to be in same directory !
    # environment:
    #   NODE_OPTIONS: '--max-old-space-size=4096'
    # deploy:
    #   resources:
    #     limits:
    #       memory: 4g
    # cpus: '1.0'
    build:
      context: ../..
      args:
        HOSTNAME: ${HOSTNAME}
        DEV_USER: ${DEV_USER}
        DEV_GIT_EMAIL: ${DEV_GIT_EMAIL}
        DEV_GIT_NAME: ${DEV_GIT_NAME}
      dockerfile: ./docker/frontend/Dockerfile
    depends_on:
      # created in include part
      - opsi-server
    ports:
      - ${WEBGUI_DEV_PORT}:8888
      - 8889:8889
      - 6006:6006
    hostname: ${HOSTNAME}
    domainname: ${DOMAINNAME}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - opsi_data:/data
      - ./files/docker-entrypoint.sh:/docker-entrypoint.sh
      - ../../:/workspace
    working_dir: /workspace/frontend
    entrypoint: [ '/docker-entrypoint.sh' ]
