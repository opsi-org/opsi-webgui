[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:redis-server]
command=/usr/bin/redis-server /etc/redis/redis.conf
autostart=true
autorestart=true
user=redis

[program:mariadb-server]
command=/usr/sbin/mysqld --basedir=/usr --datadir=/var/lib/mysql --plugin-dir=/usr/lib/x86_64-linux-gnu/mariadb18/plugin --user=mysql --skip-log-error --pid-file=/var/run/mysqld/mysqld.pid --socket=/var/run/mysqld/mysqld.sock --port=3306
autostart=true
autorestart=true
user=mysql
stderr_logfile=/var/log/mysql/error.log

[program:opsiconfd]
command=/workspace/scripts/start-opsiconfd.sh
autostart=false
autorestart=false
directory=/workspace/docker/opsiconfd
stdout_logfile=/var/log/opsi/opsiconfd/stdout.log
stderr_logfile=/var/log/opsi/opsiconfd/stderr.log
